<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Árbol Genealógico Lumínico HD con Edición</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b0f19;
            color: #fff;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 24px;
        }
        .interactive {
            pointer-events: auto;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(20, 25, 45, 0.85);
            backdrop-filter: blur(16px);
            padding: 16px 28px;
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 10px 40px rgba(0,0,0,0.4), 0 0 20px rgba(56, 189, 248, 0.1);
        }
        h1 {
            font-size: 1.6rem;
            background: linear-gradient(45deg, #38bdf8, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
            letter-spacing: 0.5px;
        }
        .header-actions {
            display: flex;
            gap: 15px;
            align-items: center;
        }
        .search-box {
            display: flex;
            gap: 10px;
        }
        input, select, textarea, button {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 9px 16px;
            border-radius: 10px;
            outline: none;
            transition: all 0.3s;
            font-size: 0.9rem;
        }
        input:focus, select:focus, textarea:focus {
            border-color: #38bdf8;
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.3);
        }
        button {
            cursor: pointer;
            background: linear-gradient(135deg, #38bdf8 0%, #2563eb 100%);
            border: none;
            color: #fff;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
        }
        button.btn-add {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        }
        button:hover {
            opacity: 0.95;
            transform: translateY(-1px);
        }
        .controls-footer {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }
        .mode-buttons {
            display: flex;
            gap: 10px;
            background: rgba(20, 25, 45, 0.85);
            backdrop-filter: blur(16px);
            padding: 10px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }
        .mode-btn {
            background: rgba(255, 255, 255, 0.05);
            color: #cbd5e1;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: none;
        }
        .mode-btn.active {
            background: #38bdf8;
            color: #0b0f19;
            font-weight: bold;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.5);
        }
        .drawer {
            position: absolute;
            right: -420px;
            top: 95px;
            width: 380px;
            height: calc(100% - 115px);
            background: rgba(15, 20, 35, 0.92);
            backdrop-filter: blur(25px);
            border-left: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: -15px 0 50px rgba(0,0,0,0.7);
            transition: right 0.4s cubic-bezier(0.1, 1, 0.1, 1);
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 20;
            border-radius: 20px 0 0 20px;
            overflow-y: auto;
        }
        .drawer.open {
            right: 0;
        }
        .drawer-close {
            align-self: flex-end;
            background: none;
            box-shadow: none;
            border: none;
            color: #94a3b8;
            font-size: 1.5rem;
            cursor: pointer;
        }
        .drawer-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: #1e293b;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            font-weight: bold;
            border: 3px solid #38bdf8;
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.4);
            background-size: cover;
            background-position: center;
        }
        .drawer-info h2 {
            text-align: center;
            font-size: 1.4rem;
            margin-bottom: 5px;
            color: #f8fafc;
        }
        .drawer-info p {
            text-align: center;
            color: #94a3b8;
            font-size: 0.9rem;
            margin-bottom: 15px;
        }
        .bio-box {
            background: rgba(255, 255, 255, 0.05);
            padding: 14px;
            border-radius: 12px;
            font-size: 0.9rem;
            line-height: 1.5;
            color: #e2e8f0;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .context-actions {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 10px;
        }
        .context-actions button {
            background: rgba(56, 189, 248, 0.15);
            border: 1px solid rgba(56, 189, 248, 0.3);
            color: #38bdf8;
            padding: 10px;
            border-radius: 8px;
            font-weight: 600;
            text-align: left;
            transition: all 0.2s;
        }
        .context-actions button:hover {
            background: rgba(56, 189, 248, 0.3);
            color: #fff;
        }
        .modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            width: 460px;
            max-height: 90vh;
            background: rgba(15, 20, 35, 0.96);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 25px 60px rgba(0,0,0,0.8);
            border-radius: 20px;
            padding: 28px;
            z-index: 30;
            display: flex;
            flex-direction: column;
            gap: 15px;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.1, 1, 0.1, 1);
            overflow-y: auto;
        }
        .modal.open {
            transform: translate(-50%, -50%) scale(1);
            opacity: 1;
            pointer-events: auto;
        }
        .modal h2 {
            font-size: 1.3rem;
            color: #38bdf8;
            margin-bottom: 5px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .form-group label {
            font-size: 0.82rem;
            color: #cbd5e1;
            font-weight: 500;
        }
        .form-row {
            display: flex;
            gap: 12px;
        }
        .form-row .form-group {
            flex: 1;
        }
        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 10px;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <div class="ui-layer">
        <header class="interactive">
            <h1>✨ Árbol Genealógico Lumínico HD</h1>
            <div class="header-actions">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="Buscar familiar...">
                    <button id="searchBtn">Buscar</button>
                </div>
            </div>
        </header>

        <div class="controls-footer">
            <div class="mode-buttons interactive">
                <button class="mode-btn active" data-mode="constellation">Constelación</button>
                <button class="mode-btn" data-mode="tower">Torre Prismática</button>
                <button class="mode-btn" data-mode="spiral">Espiral de ADN</button>
            </div>
        </div>
    </div>

    <!-- Panel Biografía & Menú Contextual -->
    <div class="drawer interactive" id="bioDrawer">
        <button class="drawer-close" id="closeDrawer">&times;</button>
        <div class="drawer-avatar" id="drawerAvatar"></div>
        <div class="drawer-info">
            <h2 id="drawerName">Nombre Apellido</h2>
            <p id="drawerMeta">1940 - 2020 • Madrid</p>
            <div class="bio-box" id="drawerBio">Biografía...</div>
            
            <div class="context-actions">
                <button id="btnEditMember" style="background: rgba(16, 185, 129, 0.2); border-color: #10b981; color: #34d399;">✏️ Editar datos del miembro</button>
                <p style="font-size: 0.8rem; color: #94a3b8; margin-top: 5px;">Añadir familiar respecto a esta persona:</p>
                <button id="btnAddParent">➕ Añadir Padre / Madre</button>
                <button id="btnAddSibling">➕ Añadir Hermano / a</button>
                <button id="btnAddSpouse">➕ Añadir Pareja</button>
                <button id="btnAddChild">➕ Añadir Hijo / a</button>
            </div>
        </div>
    </div>

    <!-- Modal Formulario (Añadir / Editar) -->
    <div class="modal interactive" id="addModal">
        <h2 id="modalTitle">Añadir Familiar</h2>
        <div class="form-row">
            <div class="form-group">
                <label>Nombre</label>
                <input type="text" id="addName" placeholder="Ej. Sofía">
            </div>
            <div class="form-group">
                <label>Apellidos</label>
                <input type="text" id="addSurname" placeholder="Ej. Pérez Gómez">
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>Género</label>
                <select id="addGender">
                    <option value="M">Masculino</option>
                    <option value="F">Femenino</option>
                </select>
            </div>
            <div class="form-group">
                <label>Generación</label>
                <input type="number" id="addGen" min="1" max="6">
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>Año Nacimiento</label>
                <input type="number" id="addBirth" placeholder="1995">
            </div>
            <div class="form-group">
                <label>Año Fallecimiento (opcional)</label>
                <input type="number" id="addDeath" placeholder="En blanco si vive">
            </div>
        </div>
        <div class="form-group">
            <label>Profesión</label>
            <input type="text" id="addProf" placeholder="Ej. Ingeniera">
        </div>
        <div class="form-group">
            <label>Lugar de nacimiento</label>
            <input type="text" id="addPlace" placeholder="Ej. Valencia, España">
        </div>
        <div class="form-group">
            <label>Breve biografía</label>
            <textarea id="addBio" rows="2" placeholder="Notas..."></textarea>
        </div>
        <div class="form-group">
            <label>Ruta de Foto (opcional, ej: img/sofia.jpg)</label>
            <input type="text" id="addPhoto" placeholder="">
        </div>
        <div class="modal-actions">
            <button id="cancelModalBtn" style="background: rgba(255,255,255,0.1)">Cancelar</button>
            <button class="btn-add" id="saveMemberBtn">Guardar</button>
        </div>
    </div>

    <script>
        let familyData = [
            { id: 1, name: "Abuelo", surname: "Pérez Gómez", gender: "M", generation: 1, birthYear: 1940, deathYear: 2020, birthPlace: "Madrid, España", profession: "Maestro", bio: "Pilar fundamental.", photo: null, spouseId: 2, parents: [], children: [5, 6] },
            { id: 2, name: "Abuela", surname: "Martín López", gender: "F", generation: 1, birthYear: 1942, deathYear: 2023, birthPlace: "Toledo, España", profession: "Enfermera", bio: "Cuidadora incansable.", photo: null, spouseId: 1, parents: [], children: [5, 6] },
            { id: 5, name: "Padre", surname: "Pérez Martín", gender: "M", generation: 2, birthYear: 1970, deathYear: null, birthPlace: "Madrid, España", profession: "Ingeniero", bio: "Apasionado de la tecnología.", photo: null, spouseId: 7, parents: [1, 2], children: [10, 11] },
            { id: 7, name: "Madre", surname: "Sánchez Ruiz", gender: "F", generation: 2, birthYear: 1972, deathYear: null, birthPlace: "Sevilla, España", profession: "Arquitecta", bio: "Creativa.", photo: null, spouseId: 5, parents: [], children: [10, 11] },
            { id: 10, name: "Tú", surname: "Pérez Sánchez", gender: "M", generation: 3, birthYear: 2000, deathYear: null, birthPlace: "Madrid, España", profession: "Estudiante", bio: "Creador del árbol.", photo: null, spouseId: null, parents: [5, 7], children: [] },
            { id: 11, name: "Hermano/a", surname: "Pérez Sánchez", gender: "F", generation: 3, birthYear: 2003, deathYear: null, birthPlace: "Madrid, España", profession: "Diseñadora", bio: "Artista.", photo: null, spouseId: null, parents: [5, 7], children: [] }
        ];

        let selectedPersonId = null;
        let actionState = null; // 'parent', 'sibling', 'spouse', 'child', 'edit'

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x0b0f19, 0.012);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 20, 60);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
        scene.add(ambientLight);
        const dirLight1 = new THREE.DirectionalLight(0x38bdf8, 1.5);
        dirLight1.position.set(20, 40, 30);
        scene.add(dirLight1);
        const dirLight2 = new THREE.DirectionalLight(0xc084fc, 1.0);
        dirLight2.position.set(-20, -20, -20);
        scene.add(dirLight2);

        const starsGeo = new THREE.BufferGeometry();
        const starsCount = 900;
        const starPos = new Float32Array(starsCount * 3);
        for(let i=0; i<starsCount*3; i++) starPos[i] = (Math.random() - 0.5) * 450;
        starsGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        const starsMat = new THREE.PointsMaterial({color: 0x93c5fd, size: 1.0, transparent: true, opacity: 0.8});
        const starField = new THREE.Points(starsGeo, starsMat);
        scene.add(starField);

        let nodeMeshes = [];
        let connectionsGroup = new THREE.Group();
        scene.add(connectionsGroup);

        function createCardTexture(person) {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 640;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = 'rgba(15, 23, 42, 0.94)';
            ctx.roundRect(20, 20, 984, 600, 35);
            ctx.fill();
            
            ctx.lineWidth = 8;
            const strokeColor = person.gender === 'M' ? '#38bdf8' : '#f43f5e';
            ctx.strokeStyle = strokeColor;
            ctx.shadowColor = strokeColor;
            ctx.shadowBlur = 15;
            ctx.stroke();
            ctx.shadowBlur = 0;

            ctx.save();
            ctx.beginPath();
            ctx.arc(150, 200, 90, 0, Math.PI * 2);
            ctx.clip();
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(60, 110, 180, 180);
            
            if (person.photo) {
                const img = new Image();
                img.src = person.photo;
                ctx.drawImage(img, 60, 110, 180, 180);
            } else {
                ctx.fillStyle = strokeColor;
                ctx.font = 'bold 64px Segoe UI';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText((person.name[0] + (person.surname ? person.surname[0] : '')).toUpperCase(), 150, 200);
            }
            ctx.restore();

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 52px Segoe UI';
            ctx.textAlign = 'left';
            ctx.fillText(person.name, 280, 160);

            ctx.font = '40px Segoe UI';
            ctx.fillStyle = '#cbd5e1';
            ctx.fillText(person.surname || '', 280, 220);

            ctx.font = '34px Segoe UI';
            ctx.fillStyle = '#38bdf8';
            ctx.fillText(person.profession || 'Sin profesión', 280, 310);

            ctx.font = '30px Segoe UI';
            ctx.fillStyle = '#94a3b8';
            ctx.fillText(`${person.birthYear} - ${person.deathYear || 'Presente'}`, 280, 420);
            ctx.fillText(`📍 ${person.birthPlace || 'España'}`, 280, 485);

            return new THREE.CanvasTexture(canvas);
        }

        function calculatePositions(mode) {
            const positions = {};
            const genGroups = {};

            familyData.forEach(p => {
                if(!genGroups[p.generation]) genGroups[p.generation] = [];
                genGroups[p.generation].push(p);
            });

            const gens = Object.keys(genGroups);
            gens.forEach((gen, gIdx) => {
                const members = genGroups[gen];
                members.forEach((p, mIdx) => {
                    let pos = new THREE.Vector3();
                    const angleStep = (Math.PI * 2) / Math.max(members.length, 1);
                    const angle = mIdx * angleStep;

                    if (mode === 'constellation') {
                        const radius = gIdx === 0 ? 0 : (gIdx * 16 + 5);
                        pos.set(Math.cos(angle) * radius, (gens.length - gIdx) * 16 - 15, Math.sin(angle) * radius);
                    } else if (mode === 'tower') {
                        const radius = 22;
                        pos.set(Math.cos(angle) * radius, (gens.length - gIdx) * 18 - 20, Math.sin(angle) * radius);
                    } else if (mode === 'spiral') {
                        const totalIdx = familyData.indexOf(p);
                        const spiralAngle = totalIdx * 0.9;
                        const radius = 24;
                        pos.set(Math.cos(spiralAngle) * radius, totalIdx * 8 - 20, Math.sin(spiralAngle) * radius);
                    }
                    positions[p.id] = pos;
                });
            });
            return positions;
        }

        let currentMode = 'constellation';
        let positions = calculatePositions(currentMode);

        function buildTree() {
            nodeMeshes.forEach(m => scene.remove(m));
            nodeMeshes = [];
            while(connectionsGroup.children.length > 0) { 
                connectionsGroup.remove(connectionsGroup.children[0]); 
            }

            familyData.forEach(person => {
                const texture = createCardTexture(person);
                const mat = new THREE.MeshBasicMaterial({ map: texture, transparent: true, side: THREE.DoubleSide });
                const geo = new THREE.PlaneGeometry(12, 7.5);
                const mesh = new THREE.Mesh(geo, mat);

                const pos = positions[person.id] || new THREE.Vector3(0,0,0);
                mesh.position.copy(pos);
                mesh.userData = person;
                scene.add(mesh);
                nodeMeshes.push(mesh);
            });

            familyData.forEach(person => {
                const startPos = positions[person.id];
                if (!startPos) return;
                
                person.children.forEach(childId => {
                    const childPos = positions[childId];
                    if(childPos) createConnection(startPos, childPos, 0x38bdf8, 0.7);
                });

                if(person.spouseId && person.id < person.spouseId) {
                    const spousePos = positions[person.spouseId];
                    if(spousePos) createConnection(startPos, spousePos, 0xf43f5e, 0.8);
                }
            });
        }

        function createConnection(v1, v2, colorHex, opacity) {
            const curve = new THREE.QuadraticBezierCurve3(v1, new THREE.Vector3((v1.x + v2.x)/2, Math.max(v1.y, v2.y) + 5, (v1.z + v2.z)/2), v2);
            const points = curve.getPoints(35);
            const geometry = new THREE.BufferGeometry().setFromPoints(points);
            const material = new THREE.LineBasicMaterial({ color: colorHex, transparent: true, opacity: opacity, linewidth: 2 });
            connectionsGroup.add(new THREE.Line(geometry, material));
        }

        buildTree();

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('click', (e) => {
            if(e.target.closest('.ui-layer') || e.target.closest('.drawer') || e.target.closest('.modal')) return;

            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(nodeMeshes);

            if(intersects.length > 0) {
                const person = intersects[0].object.userData;
                selectedPersonId = person.id;
                openDrawer(person);
                
                const targetPos = intersects[0].object.position;
                new TWEEN.Tween(camera.position).to({ x: targetPos.x, y: targetPos.y + 2, z: targetPos.z + 24 }, 1000).easing(TWEEN.Easing.Cubic.Out).start();
                controls.target.copy(targetPos);
            }
        });

        function openDrawer(person) {
            document.getElementById('drawerName').innerText = `${person.name} ${person.surname || ''}`;
            document.getElementById('drawerMeta').innerText = `Generación ${person.generation} • ${person.birthYear} - ${person.deathYear || 'Presente'}`;
            document.getElementById('drawerBio').innerText = person.bio || 'Sin biografía.';
            
            const avatar = document.getElementById('drawerAvatar');
            if(person.photo) {
                avatar.style.backgroundImage = `url(${person.photo})`;
                avatar.innerText = '';
            } else {
                avatar.style.backgroundImage = 'none';
                avatar.innerText = (person.name[0] + (person.surname ? person.surname[0] : '')).toUpperCase();
            }
            
            document.getElementById('bioDrawer').classList.add('open');
        }

        document.getElementById('closeDrawer').addEventListener('click', () => document.getElementById('bioDrawer').classList.remove('open'));

        const modal = document.getElementById('addModal');

        document.getElementById('btnEditMember').addEventListener('click', () => {
            actionState = 'edit';
            const target = familyData.find(p => p.id === selectedPersonId);
            if(!target) return;

            document.getElementById('modalTitle').innerText = `Editar a ${target.name}`;
            document.getElementById('addName').value = target.name;
            document.getElementById('addSurname').value = target.surname || '';
            document.getElementById('addGender').value = target.gender;
            document.getElementById('addGen').value = target.generation;
            document.getElementById('addBirth').value = target.birthYear || '';
            document.getElementById('addDeath').value = target.deathYear || '';
            document.getElementById('addProf').value = target.profession || '';
            document.getElementById('addPlace').value = target.birthPlace || '';
            document.getElementById('addBio').value = target.bio || '';
            document.getElementById('addPhoto').value = target.photo || '';

            document.getElementById('bioDrawer').classList.remove('open');
            modal.classList.add('open');
        });

        function openModalForRelation(mode) {
            actionState = mode;
            const target = familyData.find(p => p.id === selectedPersonId);
            if(!target) return;

            let gen = target.generation;
            let title = "";

            if(mode === 'parent') { gen = target.generation - 1; title = `Añadir Padre/Madre de ${target.name}`; }
            if(mode === 'sibling') { gen = target.generation; title = `Añadir Hermano/a de ${target.name}`; }
            if(mode === 'spouse') { gen = target.generation; title = `Añadir Pareja de ${target.name}`; }
            if(mode === 'child') { gen = target.generation + 1; title = `Añadir Hijo/a de ${target.name}`; }

            document.getElementById('modalTitle').innerText = title;
            document.getElementById('addName').value = '';
            document.getElementById('addSurname').value = target.surname || '';
            document.getElementById('addGen').value = gen;
            document.getElementById('addBirth').value = '';
            document.getElementById('addDeath').value = '';
            document.getElementById('addProf').value = '';
            document.getElementById('addPlace').value = '';
            document.getElementById('addBio').value = '';
            document.getElementById('addPhoto').value = '';
            
            document.getElementById('bioDrawer').classList.remove('open');
            modal.classList.add('open');
        }

        document.getElementById('btnAddParent').addEventListener('click', () => openModalForRelation('parent'));
        document.getElementById('btnAddSibling').addEventListener('click', () => openModalForRelation('sibling'));
        document.getElementById('btnAddSpouse').addEventListener('click', () => openModalForRelation('spouse'));
        document.getElementById('btnAddChild').addEventListener('click', () => openModalForRelation('child'));
        document.getElementById('cancelModalBtn').addEventListener('click', () => modal.classList.remove('open'));

        document.getElementById('saveMemberBtn').addEventListener('click', () => {
            const name = document.getElementById('addName').value.trim();
            const surname = document.getElementById('addSurname').value.trim();
            if(!name) { alert('Introduce el nombre.'); return; }

            if(actionState === 'edit') {
                const target = familyData.find(p => p.id === selectedPersonId);
                if(target) {
                    target.name = name;
                    target.surname = surname;
                    target.gender = document.getElementById('addGender').value;
                    target.generation = parseInt(document.getElementById('addGen').value) || target.generation;
                    target.birthYear = parseInt(document.getElementById('addBirth::val')) || target.birthYear; // fix below
                    target.birthYear = parseInt(document.getElementById('addBirth').value) || null;
                    target.deathYear = parseInt(document.getElementById('addDeath').value) || null;
                    target.profession = document.getElementById('addProf').value;
                    target.birthPlace = document.getElementById('addPlace').value;
                    target.bio = document.getElementById('addBio').value;
                    target.photo = document.getElementById('addPhoto').value.trim() || null;
                }
            } else {
                const newId = Math.max(...familyData.map(p => p.id), 0) + 1;
                const newMember = {
                    id: newId,
                    name: name,
                    surname: surname,
                    gender: document.getElementById('addGender').value,
                    generation: parseInt(document.getElementById('addGen').value) || 3,
                    birthYear: parseInt(document.getElementById('addBirth').value) || 2000,
                    deathYear: parseInt(document.getElementById('addDeath').value) || null,
                    birthPlace: document.getElementById('addPlace').value || 'España',
                    profession: document.getElementById('addProf').value || 'Sin profesión',
                    bio: document.getElementById('addBio').value || '',
                    photo: document.getElementById('addPhoto').value.trim() || null,
                    spouseId: null, parents: [], children: []
                };

                const target = familyData.find(p => p.id === selectedPersonId);
                if(target) {
                    if(actionState === 'parent') {
                        newMember.children.push(target.id);
                        target.parents.push(newId);
                    } else if(actionState === 'sibling') {
                        newMember.parents = [...target.parents];
                        target.parents.forEach(pid => {
                            const p = familyData.find(x => x.id === pid);
                            if(p && !p.children.includes(newId)) p.children.push(newId);
                        });
                    } else if(actionState === 'spouse') {
                        newMember.spouseId = target.id;
                        target.spouseId = newId;
                    } else if(actionState === 'child') {
                        newMember.parents.push(target.id);
                        target.children.push(newId);
                    }
                }
                familyData.push(newMember);
            }

            positions = calculatePositions(currentMode);
            buildTree();
            modal.classList.remove('open');
            alert('¡Cambios guardados con éxito!');
        });

        document.querySelectorAll('.mode-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                currentMode = e.target.dataset.mode;
                positions = calculatePositions(currentMode);
                buildTree();
            });
        });

        document.getElementById('searchBtn').addEventListener('click', performSearch);
        document.getElementById('searchInput').addEventListener('keypress', (e) => { if(e.key === 'Enter') performSearch(); });

        function performSearch() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const found = familyData.find(p => p.name.toLowerCase().includes(query) || (p.surname && p.surname.toLowerCase().includes(query)));
            if(found) {
                const mesh = nodeMeshes.find(m => m.userData.id === found.id);
                if(mesh) {
                    openDrawer(found);
                    new TWEEN.Tween(camera.position).to({ x: mesh.position.x, y: mesh.position.y + 2, z: mesh.position.z + 24 }, 1000).easing(TWEEN.Easing.Cubic.Out).start();
                    controls.target.copy(mesh.position);
                }
            } else { alert('Familiar no encontrado.'); }
        }

        function animate(time) {
            requestAnimationFrame(animate);
            TWEEN.update(time);
            starField.rotation.y += 0.0003;
            nodeMeshes.forEach(mesh => mesh.quaternion.copy(camera.quaternion));
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
